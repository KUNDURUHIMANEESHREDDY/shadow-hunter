name: Python tests and sponsor boundary checks

on:
  push:
    branches: [main, feature/diwali-sponsor-guarded-integrations]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" fastapi uvicorn httpx
      - name: Compile source and tests
        run: python -m compileall -q src/shadow_hunter tests
      - name: Test sponsor boundaries and regression suite
        run: python -m pytest -q
      - name: Validate tracked repository files
        run: python scripts/validate-repo.py
