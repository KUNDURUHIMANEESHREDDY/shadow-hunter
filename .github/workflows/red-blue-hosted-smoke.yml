name: Hosted Red-Blue model smoke (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_provider_calls:
        description: "I authorize up to 2 NVIDIA hosted model requests per round, which may incur charges"
        required: true
        type: boolean
        default: false
      rounds:
        description: "Synthetic Red/Blue rounds (1-3; two NVIDIA calls each)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

jobs:
  hosted-red-blue:
    # No NVIDIA calls if the manual authorization checkbox is not selected.
    if: ${{ inputs.confirm_provider_calls == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: shadow-hunter-manual-red-blue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated synthetic evaluation runtime
        run: python -m pip install -e .
      - name: Verify NVIDIA key and execute bounded hosted Red/Blue run
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RUN_ROUNDS: ${{ inputs.rounds }}
          AWS_EC2_METADATA_DISABLED: "true"
          SHADOW_HUNTER_A2A_KEYS_SECRET_ARN: ""
          SHADOW_HUNTER_HARNESS_ARN: ""
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "NVIDIA_API_KEY repository secret is not configured"; exit 2; }
          mkdir -p artifacts
          python scripts/run_red_blue_hosted.py --allow-provider-calls --rounds "$RUN_ROUNDS" --output artifacts/red-blue-hosted-evidence.json
      - name: Upload redacted hosted policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-hunter-hosted-red-blue-evidence
          path: artifacts/red-blue-hosted-evidence.json
          if-no-files-found: ignore
          retention-days: 7
