name: Python tests and sponsor boundary checks

on:
  push:
    branches: [main, 'feature/**', 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" fastapi uvicorn httpx
      - name: Validate account-cost alert CloudFormation template
        run: |
          python -m pip install 'cfn-lint>=1,<2'
          cfn-lint infra/budgets/staging-budget.yaml
      - name: Compile source and tests
        run: python -m compileall -q src/shadow_hunter tests
      - name: Keyless AWS and Cognito authentication contract gate
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m pytest -q tests/test_keyless_auth.py
      - name: Security and recovery fault-injection gate
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          SHADOW_HUNTER_HARNESS_ARN: ""
        run: python -m pytest -q tests/test_security_recovery_e2e.py tests/test_agentcore_recovery.py
      - name: Test sponsor boundaries and regression suite
        run: python -m pytest -q
      - name: Validate tracked repository files
        run: python scripts/validate-repo.py
      - name: Run autonomous synthetic Red/Blue evaluation twice and verify reproducibility
        run: |
          mkdir -p artifacts
          python scripts/run_red_blue_synthetic.py --rounds 8 --output artifacts/red-blue-evaluation.json
          python scripts/run_red_blue_synthetic.py --rounds 8 --output artifacts/red-blue-evaluation-repeat.json
          cmp artifacts/red-blue-evaluation.json artifacts/red-blue-evaluation-repeat.json
      - name: Publish redacted reproducible security evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-hunter-red-blue-evidence
          path: artifacts/red-blue-evaluation.json
          if-no-files-found: error
          retention-days: 14


  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and browser testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" fastapi uvicorn httpx pytest-playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser synthetic agent and operator workflows
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          SHADOW_HUNTER_HARNESS_ARN: ""
        run: |
          python -m pytest -q tests/e2e --browser chromium --screenshot only-on-failure --tracing retain-on-failure --output test-results
      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-hunter-browser-e2e-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 5
