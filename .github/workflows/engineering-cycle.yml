name: Shadow Hunter hourly engineering cycle

on:
  schedule:
    # Seven minutes past the hour avoids the top of the hour, when scheduled
    # workflows are more likely to experience queue delays.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-hunter-engineering-cycle
  cancel-in-progress: false

jobs:
  engineering-cycle:
    # Keep disabled until the API key and automation variable are configured.
    if: vars.SHADOW_HUNTER_AUTOMATION_ENABLED == 'true' && github.run_started_at < '2026-11-28T00:00:00Z'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Verify environment and run one bounded cycle
        shell: pwsh
        env:
          SHADOW_HUNTER_AUTOMATION_ENABLED: ${{ vars.SHADOW_HUNTER_AUTOMATION_ENABLED }}
          SHADOW_HUNTER_DEADLINE_UTC: "2026-11-28T00:00:00Z"
          SHADOW_HUNTER_MODEL: ${{ vars.SHADOW_HUNTER_MODEL || 'gpt-6.1-sol' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_STARTED_AT: ${{ github.run_started_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/run-cycle.ps1
