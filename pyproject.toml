[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-hunter"
version = "0.2.0"
description = "Deterministic authorization and audit for governed AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyJWT[crypto]>=2.10"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "PyJWT[crypto]>=2.10"]
aws = ["boto3>=1.44"]

[project.scripts]
shadow-hunter-api = "shadow_hunter.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadow_hunter = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
