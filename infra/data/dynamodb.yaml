AWSTemplateFormatVersion: "2010-09-09"
Description: Shadow Hunter transactional single-table DynamoDB store.
Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Selects the table name and deletion-protection behavior.

Resources:
  ShadowHunterDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub shadow-hunter-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 35
      DeletionProtectionEnabled: !Equals [!Ref Environment, production]
      Tags:
        - Key: Application
          Value: ShadowHunter
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TableName:
    Description: Set SHADOW_HUNTER_DYNAMODB_TABLE to this value.
    Value: !Ref ShadowHunterDataTable
  TableArn:
    Description: Scope the application task role to this table and its GSI.
    Value: !GetAtt ShadowHunterDataTable.Arn
